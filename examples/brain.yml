#Arguments with null are to be populated or removed from the config prior to
#model run. Where (required) is in brackets, these must be provided.
#
#Some arguments have (required-optional) meaning they are required but only if
#they apply to your data (e.g. categorical_features is required if you have
#categorical features).
#
#It is advised to refer to docs/config.rst for full guidance and explanation on
#how to run the model.


paths:
    file_path: null # (required)
    folder_path: null
    output_path: null # (required)
    validation_path: null

data_classification:
    target_column: null # (required)
    custom_index: null
    categorical_features: null # (required-optional)
    numerical_features: null # (required-optional)
    weight_column: null
    is_time_series: False

transforming_inputs:
    column_name_to_drop_rows: null
    value_in_row: null
    classification_prediction: null # (required-optional)
    split_by_value: null
    split_size: null
    sample_size_encode: False
    select_encode_values: False
    encode_values_to_drop: null

modelling:
    model_choice: null # (required)
    full_transformations: False
    cv: null
    skip_feature_selection: False
    intensive_feature_selection: False
